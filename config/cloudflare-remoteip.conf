# Cloudflare proxies every request, so without this Apache sees (and logs) a
# Cloudflare edge IP instead of the visitor's. mod_remoteip swaps in the
# CF-Connecting-IP header, but only for requests that actually come from
# Cloudflare's ranges, so a direct-to-origin request can't spoof it.
#
# Ranges from https://www.cloudflare.com/ips/ (fetched 2026-11-03); they
# change rarely, but recheck if logs start showing Cloudflare IPs again.
#
# Install on the server:
#
#     sudo cp config/cloudflare-remoteip.conf /etc/apache2/conf-available/
#     sudo a2enmod remoteip
#     sudo a2enconf cloudflare-remoteip
#     sudo apache2ctl configtest && sudo systemctl reload apache2

<IfModule mod_remoteip.c>
    RemoteIPHeader CF-Connecting-IP

    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18
    RemoteIPTrustedProxy 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22

    RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32
    RemoteIPTrustedProxy 2405:b500::/32 2405:8100::/32 2a06:98c0::/29
    RemoteIPTrustedProxy 2c0f:f248::/32
</IfModule>

# Same as the stock "combined" format but with %a (the client IP after
# mod_remoteip) instead of %h (the connecting peer, i.e. Cloudflare).
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined_realip
