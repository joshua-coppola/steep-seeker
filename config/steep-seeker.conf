<VirtualHost *:80>
        ServerName steepseeker.com
        ServerAlias *.steepseeker.com
        ErrorLog /var/log/steep-seeker/error.log
        LogLevel warn
        CustomLog /var/log/steep-seeker/access.log combined
        RewriteEngine on
        RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>