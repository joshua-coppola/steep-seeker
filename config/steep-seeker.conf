<VirtualHost *:80>
        ServerName steepseeker.com
        WSGIScriptAlias / /var/www/steep-seeker/steep-seeker.wsgi application-group=%{GLOBAL}
        <Directory /var/www/steep-seeker/>
                Options FollowSymLinks
                AllowOverride None
                Require all granted
        </Directory>
        ErrorLog /var/www/steep-seeker/error.log
        LogLevel warn
        CustomLog /var/www/steep-seeker/access.log combined
        Redirect 301 /ads.txt https://srv.adstxtmanager.com/19390/steepseeker.com
RewriteEngine on
RewriteCond %{SERVER_NAME} =steepseeker.com [OR]
RewriteCond %{SERVER_NAME} =192.168.1.46
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>