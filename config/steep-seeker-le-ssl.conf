<IfModule mod_ssl.c>
<VirtualHost *:443>
        ServerName steepseeker.com
        Redirect 301 /ads.txt https://srv.adstxtmanager.com/19390/steepseeker.com
        ProxyPreserveHost On
        ProxyPass /ads.txt !
        ProxyPass / http://127.0.0.1:8000/
        ProxyPassReverse / http://127.0.0.1:8000/
        ErrorLog /var/www/steep-seeker/error.log
        LogLevel warn
        CustomLog /var/www/steep-seeker/access.log combined
ServerAlias *.steepseeker.com
SSLCertificateFile /etc/letsencrypt/live/steepseeker.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/steepseeker.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>